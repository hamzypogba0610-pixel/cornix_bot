name: Ingest
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python scripts/ingest.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
