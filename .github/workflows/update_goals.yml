name: Reset and Reingest

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Reset matches table and reingest
        run: python scripts/ingest.py reset
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
