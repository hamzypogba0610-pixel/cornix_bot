name: Update Goals

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Run update_goals
        run: python scripts/ingest.py update_goals
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
