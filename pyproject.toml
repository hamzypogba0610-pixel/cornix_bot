[project]
name = "cfcx"
version = "0.1.0"
description = "Corner Fusion & Calibration eXtreme"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn",
    "pandas",
    "numpy",
    "scipy",
    "sqlalchemy",
    "psycopg2-binary",
    "pydantic",
    "pyyaml",
    "requests",
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cfcx*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["I001", "DTZ007", "BLE001"]
